[project]
name = "document-library-web"
version = "1.1.0"
description = "Aplicação web (Django) da biblioteca de documentos: API REST, WebSocket, worker e descrição por IA."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=apps --cov-report=term-missing:skip-covered"
markers = [
    "e2e: precisa do processador Java rodando (PROCESSOR_URL) ou do jar em PROCESSOR_JAR",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:StreamingHttpResponse must consume asynchronous iterators:Warning",
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
omit = ["*/migrations/*", "*/management/commands/*"]

[tool.ruff]
line-length = 135
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108", "SIM905", "B905"]
