{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ BRAND.name }}{% endblock %}</title>
  <meta name="description" content="{{ BRAND.name }} · {{ BRAND.tagline }}">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preload" href="{% static 'fonts/public-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
  <script src="{% static 'js/theme-init.js' %}"></script>
</head>
<body>
  <template id="brand-svg">{% include "partials/logo.html" %}</template>
  {% block body %}{% endblock %}
</body>
</html>
